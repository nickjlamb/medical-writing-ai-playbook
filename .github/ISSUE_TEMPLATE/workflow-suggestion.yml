name: Workflow or content suggestion
description: Suggest a workflow, prompt pattern or topic the playbook does not cover
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What do you actually do? Describe it as a job, not as a feature request.
      placeholder: "Building an annotated reference list at project kickoff"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: With or without AI. Roughly how long does it take?
    validations:
      required: false
  - type: dropdown
    id: stage
    attributes:
      label: Where it sits in the lifecycle
      options:
        - Evidence
        - Drafting
        - Adaptation
        - Validation
        - Delivery
        - Not sure
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: What happens if it goes wrong
      description: This is what sets the risk tier and the review requirement.
    validations:
      required: false
