<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 582" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="How the playbook is organised: five principles govern every workflow; eighteen workflows run left to right across the content lifecycle — evidence (5), drafting (6), adaptation (2), validation (3) and delivery (2); and a shared layer of prompt patterns, templates and tools is reused by every stage. Every workflow card carries the same five parts: the task, the human verification, the risk tier, the prompt pattern and the failure modes.">
