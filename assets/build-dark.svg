<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="How it builds and ships: MDX content and docs.json are pushed to main, which triggers two builds in parallel — a Mintlify build that publishes playbook.pharmatools.ai, and a GitHub Actions workflow that renders the PDF with Puppeteer and attaches it to GitHub Releases. The site download link passes through a Cloudflare Worker counter, so the PDF served is always current.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767d86"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ab7df8"/></marker></defs>
<rect x="16" y="52" width="968" height="248" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="34" y="78" font-size="11" fill="#9198a1" font-weight="600">BUILD &#183; ON EVERY PUSH TO MAIN</text>
<rect x="30.0" y="170" width="180" height="56" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="120" y="193" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle">MDX content</text>
<text x="120" y="211" font-size="10.5" fill="#9198a1" text-anchor="middle">+ docs.json</text>
<polyline points="210,198 232,198" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="235.0" y="170" width="150" height="56" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="310" y="202.5" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle">push to main</text>
<polyline points="385,198 410,198 410,114 438,114" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#a)"/>
<polyline points="385,198 410,198 410,244 438,244" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="440.0" y="88" width="180" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="530" y="118.5" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle">Mintlify build</text>
<polyline points="620,114 688,114" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="690.0" y="88" width="200" height="52" rx="8" fill="#122117" stroke="#2b5233"/>
<text x="790" y="118.5" font-size="12.5" fill="#3fb950" font-weight="600" text-anchor="middle">playbook.pharmatools.ai</text>
<rect x="440.0" y="216" width="180" height="56" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="530" y="239" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle">GitHub Actions</text>
<text x="530" y="257" font-size="10.5" fill="#9198a1" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">build-pdf.yml</text>
<polyline points="620,244 688,244" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
<rect x="690.0" y="216" width="200" height="56" rx="8" fill="#122117" stroke="#2b5233"/>
<text x="790" y="239" font-size="12.5" fill="#3fb950" font-weight="600" text-anchor="middle">PDF in Releases</text>
<text x="790" y="257" font-size="10.5" fill="#9198a1" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">Puppeteer &#183; build-pdf.mjs</text>
<polyline points="790,140 790,152" fill="none" stroke="#767d86" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="680.0" y="154" width="220" height="44" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="790" y="177" font-size="12.5" fill="#e6edf3" font-weight="600" text-anchor="middle">Cloudflare Worker</text>
<text x="790" y="195" font-size="10.5" fill="#9198a1" text-anchor="middle">download counter</text>
<polyline points="790,198 790,214" fill="none" stroke="#767d86" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="322" font-size="11.5" fill="#9198a1" text-anchor="middle" font-style="italic">The PDF rebuilds on every content change &#8212; the download link always serves current content.</text>
</svg>