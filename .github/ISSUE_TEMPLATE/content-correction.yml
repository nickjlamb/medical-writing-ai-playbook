name: Content correction
description: Something in the playbook is wrong, out of date, or broken
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Policy pages date quickly. If a journal or regulator has changed position since a page was last reviewed, this is exactly the report to file.
  - type: input
    id: page
    attributes:
      label: Which page
      placeholder: https://playbook.pharmatools.ai/principles/declaring-ai-use
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the passage if you can.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Link the publisher policy page, regulation or agency guidance that shows the current position.
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Out-of-date policy or regulation
        - Factually incorrect
        - Broken link
        - Typo or formatting
        - Other
    validations:
      required: true
