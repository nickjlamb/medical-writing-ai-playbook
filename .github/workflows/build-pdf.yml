name: Build playbook PDF

on:
  push:
    branches: [main]
    paths:
      - '**.mdx'
      - 'docs.json'
      - 'scripts/build-pdf.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'snippets/**'
      - 'logo-*.svg'
      - 'lifecycle.svg'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession (e.g. a PR merge followed by a follow-up
# commit) must not race each other over the same release assets.
concurrency:
  group: build-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PDFs (playbook + complete reference)
        run: npm run build:pdf:all

      - name: Publish PDF to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PDF=Medical-Writing-AI-Playbook.pdf
          COMPLETE=Medical-Writing-AI-Playbook-Complete-Reference.pdf

          # Rolling "latest" release. This is what the site's download button
          # and the README badge point at, via the LITERAL tag name:
          #   releases/download/latest/<PDF>
          # Not releases/latest/download/<PDF> — that alias resolves to the
          # newest release by date, so a version release would steal it.
          # Replace assets explicitly rather than with --clobber: gh's clobber
          # deletes and re-uploads back to back, and the upload endpoint can
          # 404 while the deletion is still propagating. Delete, wait, upload
          # with retries.
          upload_assets() {
            local tag="$1"; shift
            for f in "$@"; do
              gh release delete-asset "$tag" "$(basename "$f")" --yes 2>/dev/null || true
            done
            sleep 5
            for attempt in 1 2 3 4; do
              if gh release upload "$tag" "$@"; then return 0; fi
              echo "Upload to $tag failed (attempt $attempt), retrying..."
              sleep $((attempt * 10))
            done
            return 1
          }

          if gh release view latest >/dev/null 2>&1; then
            upload_assets latest "$PDF" "$COMPLETE"
          else
            gh release create latest "$PDF" "$COMPLETE" \
              --title "Latest playbook PDF" \
              --notes "Auto-generated from main. Always reflects the latest content of the Medical Writing AI Playbook."
          fi
          echo "Updated rolling 'latest' release."

          # When this run was triggered by publishing a version release, also
          # attach a versioned archival copy to that release, so every version
          # keeps the PDF as it stood at tag time.
          if [ -n "${TAG:-}" ]; then
            cp "$PDF" "Medical-Writing-AI-Playbook-$TAG.pdf"
            cp "$COMPLETE" "Medical-Writing-AI-Playbook-Complete-Reference-$TAG.pdf"
            upload_assets "$TAG" "Medical-Writing-AI-Playbook-$TAG.pdf" "Medical-Writing-AI-Playbook-Complete-Reference-$TAG.pdf"
            echo "Attached archival copy to $TAG."
          fi
